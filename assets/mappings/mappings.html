<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MIDI Mappings</title>
<link rel="stylesheet" href="/shared/mapping-editor.css">
<style>
  :root {
    --bg: #f5f5f7; --surface: #ffffff; --border: #d1d1d6; --text: #1c1c1e;
    --text-dim: #6e6e73; --accent: #007aff; --red: #ff3b30; --green: #34c759;
    --orange: #ff9500; --group-bg: #e9e9ee;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 13px; color: var(--text);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); min-height: 100vh; display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 10px; padding: 12px 16px; background: var(--surface); border-bottom: 1px solid var(--border); }
  header h1 { font-size: 16px; font-weight: 600; flex: 1; }
  button { cursor: pointer; border: none; font-size: 12px; font-family: inherit; }
  .btn { padding: 6px 14px; border-radius: 6px; font-weight: 500; }
  .btn-ghost { background: var(--bg); color: var(--text); border: 1px solid var(--border); }
  .btn-ghost:hover { background: var(--border); }
  .btn-primary { background: var(--accent); color: white; }
  .btn-primary:hover { background: #005ecb; }
  .btn-warn { background: var(--orange); color: white; }
  .btn-warn:hover { background: #cc7800; }
  .hidden { display: none !important; }

  #login-view { flex: 1; display: flex; align-items: center; justify-content: center; }
  .login-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 28px; width: 300px; display: flex; flex-direction: column; gap: 12px; }
  .login-card h2 { font-size: 15px; font-weight: 600; }
  .login-card input[type=password] { padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 13px; }
  .login-card p.hint { font-size: 12px; color: var(--text-dim); }
  .login-card p.err { font-size: 12px; color: var(--red); min-height: 14px; }

  #editor-root { display: flex; flex-direction: column; flex: 1; min-height: 0; }

  footer { display: flex; align-items: center; gap: 10px; padding: 10px 16px; background: var(--surface); border-top: 1px solid var(--border); }
  #save-status { font-size: 12px; color: var(--text-dim); }
  #save-status.ok  { color: var(--green); }
  #save-status.err { color: var(--red); }
  footer span.spacer { flex: 1; }
</style>
</head>
<body>

<div id="login-view">
  <div class="login-card">
    <h2>MIDI Mappings — Sign in</h2>
    <input type="password" id="login-password" placeholder="Password">
    <button class="btn btn-primary" id="login-btn">Sign in</button>
    <p class="err" id="login-error"></p>
    <p class="hint" id="login-setup-hint"></p>
  </div>
</div>

<div id="app-view" class="hidden" style="display:flex;flex-direction:column;flex:1;min-height:0">
  <header>
    <h1>MIDI Mappings</h1>
    <button class="btn btn-ghost" id="refresh-btn">↺ Refresh Q-Sys</button>
  </header>

  <!-- mount() builds the tab/filter toolbar and the table inside this element. -->
  <div id="editor-root"></div>

  <footer>
    <button class="btn btn-primary" id="save-btn">Save</button>
    <button class="btn btn-warn" id="save-apply-btn">Save &amp; Apply</button>
    <span id="save-status"></span>
    <span class="spacer"></span>
    <!-- Shows: recalling swaps the whole mapping set and hot-reloads the
         bridge. The previous set is backed up first, so this is undoable. -->
    <span id="active-show"></span>
    <select id="show-select" title="Saved shows"></select>
    <button class="btn btn-ghost" id="show-recall-btn">Recall</button>
    <button class="btn btn-ghost" id="show-save-btn">Save as Show…</button>
    <input id="show-name-input" class="hidden" placeholder="Show name" size="18">
  </footer>
</div>

<script src="/shared/mapping-editor.js"></script>
<script>
let editor = null

async function api(path, opts) {
  const res = await fetch(path, { credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }, ...opts })
  if (res.status === 401) { showLogin(); throw new Error('Session expired — please sign in again') }
  const body = await res.json().catch(() => ({}))
  if (!res.ok) {
    // Mappings the editor carries through untouched are re-validated on save,
    // so a pre-existing malformed entry rejects the whole save. Without the
    // per-entry reasons that is a dead end — there is no row to blame and no
    // way to fix it from this page.
    const why = Array.isArray(body.details)
      ? ' — ' + body.details.map(d => `#${d.index}: ${d.reason}`).join('; ')
      : ''
    throw new Error((body.error || ('HTTP ' + res.status)) + why)
  }
  return body
}

function showLogin() {
  document.getElementById('app-view').classList.add('hidden')
  document.getElementById('login-view').classList.remove('hidden')
}

function showApp() {
  document.getElementById('login-view').classList.add('hidden')
  document.getElementById('app-view').classList.remove('hidden')
}

async function checkSession() {
  const info = await api('/api/mappings/session')
  if (!info.passwordSet) {
    document.getElementById('login-setup-hint').textContent =
      'No password set yet — open the Configurator on the bridge Mac (Network panel) to set one.'
    document.getElementById('login-btn').disabled = true
  }
  if (info.authenticated) { await loadApp(); showApp() } else { showLogin() }
}

document.getElementById('login-btn').addEventListener('click', async () => {
  const password = document.getElementById('login-password').value
  const err = document.getElementById('login-error')
  err.textContent = ''
  try {
    await api('/api/mappings/login', { method: 'POST', body: JSON.stringify({ password }) })
    document.getElementById('login-password').value = ''
    await loadApp()
    showApp()
  } catch (e) {
    err.textContent = e.message
  }
})

// The revision of the config this page's table was built from. Every save
// carries it so a tab left open across a recall cannot silently write its
// stale snapshot back over the show — the server answers 409 instead.
let revision = null

// The shared editor owns all table state. The page supplies only transport.
const adapter = {
  loadEditorState: async () => {
    const state = await api('/api/mappings')
    revision = state.revision
    showActive(state.activeShow)
    return state
  },
  getQsysStatus: async () => {
    try { await api('/api/qsys/components'); return { connected: true } }
    catch (e) { return { connected: false, message: e.message } }
  },
  discoverComponents: async () => (await api('/api/qsys/components')).components,
  getComponentControls: async (name) =>
    (await api('/api/qsys/components/' + encodeURIComponent(name) + '/controls')).controls,
  save: (m) => send('/api/mappings', m),
  saveAndApply: (m) => send('/api/mappings/apply', m),
}

/** Posts mappings with the revision they were based on, and keeps the new one. */
async function send(path, mappings) {
  const result = await api(path, { method: 'POST', body: JSON.stringify({ mappings, revision }) })
  revision = result.revision
  return result
}

async function loadApp() {
  refreshShows().catch(() => { /* the table matters more than the show list */ })
  editor = await MappingEditor.mount({
    root: document.getElementById('editor-root'),
    adapter,
    onStatus: ({ kind, text }) => {
      const el = document.getElementById('save-status')
      el.className = kind === 'ok' ? 'ok' : kind === 'err' ? 'err' : ''
      el.textContent = text
    },
  })
}

// ── Shows ────────────────────────────────────────────────────────────────────

const showSelect = document.getElementById('show-select')
const showNameInput = document.getElementById('show-name-input')

function status(kind, text) {
  const el = document.getElementById('save-status')
  el.className = kind === 'ok' ? 'ok' : kind === 'err' ? 'err' : ''
  el.textContent = text
}

/** Names the show the live mappings came from, so the header never implies none. */
function showActive(active) {
  document.getElementById('active-show').textContent = active ? 'Show: ' + active.name : ''
}

async function refreshShows() {
  const { shows } = await api('/api/mappings/shows')
  showSelect.textContent = ''
  if (!shows.length) {
    showSelect.appendChild(new Option('No shows saved yet', ''))
    showSelect.disabled = true
    return
  }
  showSelect.disabled = false
  for (const s of shows) showSelect.appendChild(new Option(s.name + '  (' + s.count + ')', s.id))
}

document.getElementById('show-recall-btn').addEventListener('click', async () => {
  const id = showSelect.value
  if (!id) return
  try {
    status('info', 'Recalling…')
    const r = await api('/api/mappings/shows/' + encodeURIComponent(id) + '/recall', { method: 'POST' })
    // Recall rewrote the config, so the table and the revision are both stale.
    await editor.reload()
    status('ok', 'Recalled "' + r.name + '" — ' + r.count + ' mappings. Faders are not motorised; move each one before it is live.')
  } catch (e) {
    status('err', e.message)
  }
})

document.getElementById('show-save-btn').addEventListener('click', async () => {
  // Reveal-on-click input rather than prompt(), which Chromium disables in
  // the Electron renderer — this keeps both hosts structurally identical.
  if (showNameInput.classList.contains('hidden')) {
    showNameInput.classList.remove('hidden')
    showNameInput.focus()
    return
  }
  const name = showNameInput.value.trim()
  if (!name) { showNameInput.classList.add('hidden'); return }
  try {
    // getMappings throws when the initial load failed, which is what stops a
    // blank table being saved as a show.
    const mappings = editor.getMappings()
    const { show } = await api('/api/mappings/shows', {
      method: 'POST', body: JSON.stringify({ name, mappings }),
    })
    showNameInput.value = ''
    showNameInput.classList.add('hidden')
    await refreshShows()
    showSelect.value = show.id
    status('ok', 'Saved show "' + show.name + '" — ' + show.count + ' mappings')
  } catch (e) {
    status('err', e.message)
  }
})

showNameInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') document.getElementById('show-save-btn').click()
  if (e.key === 'Escape') { showNameInput.value = ''; showNameInput.classList.add('hidden') }
})

document.getElementById('refresh-btn').addEventListener('click', () => { if (editor) editor.refreshComponents() })
document.getElementById('save-btn').addEventListener('click', () => { if (editor) editor.save() })
document.getElementById('save-apply-btn').addEventListener('click', () => { if (editor) editor.saveAndApply() })

checkSession().catch(e => {
  document.getElementById('login-error').textContent = 'Error: ' + e.message
})
</script>
</body>
</html>
