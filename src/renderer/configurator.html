<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Configure Mappings</title>
  <link rel="stylesheet" href="../../assets/shared/mapping-editor.css">
  <style>
    :root {
      --bg: #f5f5f7;
      --surface: #ffffff;
      --border: #d1d1d6;
      --text: #1c1c1e;
      --text-dim: #6e6e73;
      --accent: #007aff;
      --red: #ff3b30;
      --green: #34c759;
      --orange: #ff9500;
      --group-bg: #e9e9ee;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px;
      color: var(--text);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Header ── */
    header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      -webkit-app-region: drag;
    }
    header > * { -webkit-app-region: no-drag; }

    header h1 { font-size: 14px; font-weight: 600; flex: 1; }

    .status-pill {
      display: flex; align-items: center; gap: 5px;
      padding: 3px 8px; border-radius: 10px;
      background: var(--bg); font-size: 11px; color: var(--text-dim);
    }
    .dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--text-dim); flex-shrink: 0;
    }
    .dot.ok  { background: var(--green); }
    .dot.err { background: var(--red); }

    button { cursor: pointer; border: none; font-size: 12px; font-family: inherit; }
    .btn { padding: 5px 12px; border-radius: 6px; font-weight: 500; }
    .btn-ghost { background: var(--bg); color: var(--text); border: 1px solid var(--border); }
    .btn-ghost:hover { background: var(--border); }
    .btn-primary { background: var(--accent); color: white; }
    .btn-primary:hover { background: #005ecb; }
    .btn-primary:disabled { background: var(--border); color: var(--text-dim); cursor: not-allowed; }
    .btn-warn { background: var(--orange); color: white; }
    .btn-warn:hover { background: #cc7800; }
    .btn-warn:disabled { background: var(--border); color: var(--text-dim); cursor: not-allowed; }

    /* Shared-editor cells; widths live on the module's th rules. */
    table { table-layout: fixed; }

    /* body is a clipped flex column: the editor must be a shrinkable flex child
       so the table scrolls inside it and the footer stays visible. */
    #editor-root { flex: 1; min-height: 0; display: flex; flex-direction: column; }

    .hidden { display: none; }

    /* Control input: text + datalist combo */

    /* ── Network panel ── */
    #network-panel {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    #network-panel summary {
      padding: 8px 14px;
      font-size: 12px; font-weight: 600;
      cursor: pointer;
      color: var(--text);
      list-style: none;
    }
    #network-panel summary::-webkit-details-marker { display: none; }
    #network-panel summary::before { content: '▸  '; color: var(--text-dim); }
    #network-panel[open] summary::before { content: '▾  '; }
    .network-body {
      padding: 2px 14px 12px 30px;
      display: flex; flex-direction: column; gap: 8px;
    }
    .net-row {
      display: flex; align-items: center; gap: 8px;
    }
    .net-label {
      width: 80px; font-size: 11px; color: var(--text-dim); flex-shrink: 0;
    }
    .net-row code {
      font-size: 12px; background: var(--bg); padding: 3px 7px; border-radius: 4px;
      flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      min-width: 0;
    }
    .net-hint { font-size: 11px; color: var(--text-dim); min-height: 14px; }
    .switch-label {
      display: flex; align-items: center; gap: 6px;
      font-size: 12px; cursor: pointer;
    }

    /* ── Footer ── */
    footer {
      display: flex; align-items: center; gap: 10px;
      padding: 9px 14px;
      background: var(--surface);
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }
    #save-status {
      font-size: 12px; color: var(--text-dim);
    }
    #save-status.ok  { color: var(--green); }
    #save-status.err { color: var(--red); }
    footer span.spacer { flex: 1; }
    footer .hint { font-size: 11px; color: var(--text-dim); }

    /* ── Overlay ── */
    #overlay {
      position: fixed; inset: 0;
      background: rgba(245,245,247,0.88);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 10px; z-index: 100;
    }
    #overlay p { font-size: 14px; color: var(--text-dim); }
    #overlay .spinner {
      width: 28px; height: 28px;
      border: 3px solid var(--border); border-top-color: var(--accent);
      border-radius: 50%; animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<header>
  <h1>Control Assignments</h1>
  <div class="status-pill">
    <span class="dot" id="status-dot"></span>
    <span id="status-text">Connecting…</span>
  </div>
  <button class="btn btn-ghost" id="refresh-btn">↺ Refresh Q-Sys</button>
</header>

<details id="network-panel">
  <summary>Network — Q-SYS &amp; UCI</summary>
  <div class="network-body">
    <div class="net-row">
      <span class="net-label">Q-SYS Host</span>
      <input type="text" id="host-input" placeholder="e.g. 192.168.1.50" style="flex:1;max-width:200px">
      <button class="btn btn-ghost" id="host-save-btn">Connect</button>
      <span id="host-status" style="font-size:11px;color:var(--text-dim)"></span>
    </div>
    <div class="net-row">
      <span class="net-label">Local URL</span>
      <code id="net-local-url">—</code>
      <button class="btn btn-ghost" id="net-local-copy">Copy</button>
    </div>
    <div class="net-row">
      <span class="net-label">LAN URL</span>
      <code id="net-lan-url">—</code>
      <button class="btn btn-ghost" id="net-lan-copy" disabled>Copy</button>
    </div>
    <div class="net-row">
      <span class="net-label">UCI Server</span>
      <label class="switch-label">
        <input type="checkbox" id="uci-enabled-toggle">
        Enabled
      </label>
      <span class="net-label" style="width:auto;margin-left:14px">Port</span>
      <input type="number" id="uci-port-input" min="1" max="65535" step="1" style="width:80px">
      <button class="btn btn-ghost" id="uci-port-save-btn">Save</button>
      <button class="btn btn-warn hidden" id="uci-restart-btn">Restart Now</button>
    </div>
    <div class="net-row">
      <span class="net-label">Mappings Page</span>
      <input type="password" id="mappings-password-input" placeholder="Set a password to enable /mappings" style="flex:1;max-width:200px">
      <button class="btn btn-ghost" id="mappings-password-save-btn">Save</button>
      <span id="mappings-password-status" style="font-size:11px;color:var(--text-dim)"></span>
    </div>
    <div class="net-hint" id="net-hint"></div>
  </div>
</details>

  <!-- mount() builds the tab/filter toolbar and the table inside this element. -->
  <div id="editor-root"></div>

<footer>
  <button class="btn btn-primary" id="save-btn" disabled>Save</button>
  <button class="btn btn-warn"    id="save-restart-btn" disabled>Save &amp; Apply</button>
  <span id="save-status"></span>
  <span class="spacer"></span>
  <span class="hint">Restart required to apply changes to the live bridge</span>
</footer>

<div id="overlay">
  <div class="spinner"></div>
  <p id="overlay-msg">Loading…</p>
</div>

<script src="../../assets/shared/mapping-editor.js"></script>
<script>
/* global require, MappingEditor */
const { ipcRenderer, clipboard } = require('electron')

// The shared editor owns all table state. This window supplies only transport
// (IPC to the main process), the status pill and the overlay.
let editor = null

const adapter = {
  loadEditorState: async () => ({
    physicalControls: await ipcRenderer.invoke('cfg:get-physical-controls'),
    mappings: (await ipcRenderer.invoke('cfg:load-config')).mappings ?? [],
  }),
  // Also drives the header pill, as the old refreshQsys did.
  getQsysStatus: async () => {
    const dot  = document.getElementById('status-dot')
    const text = document.getElementById('status-text')
    try {
      const status = await ipcRenderer.invoke('cfg:get-qsys-status')
      dot.className = status.connected ? 'dot ok' : 'dot err'
      text.textContent = status.connected
        ? `Connected  (${status.host})`
        : 'Not connected — check Q-Sys host'
      return status
    } catch (e) {
      dot.className = 'dot err'
      text.textContent = 'Error: ' + e.message
      throw e
    }
  },
  discoverComponents: () => ipcRenderer.invoke('cfg:discover-components'),
  getComponentControls: (name) => ipcRenderer.invoke('cfg:get-component-controls', name),
  save: (m) => ipcRenderer.invoke('cfg:save-config', m),
  saveAndApply: (m) => ipcRenderer.invoke('cfg:save-and-apply', m),
}

function onStatus({ kind, text }) {
  const el = document.getElementById('save-status')
  el.className = kind === 'ok' ? 'ok' : kind === 'err' ? 'err' : ''
  el.textContent = text
}

async function init() {
  setOverlay('Loading mappings and connecting to Q-Sys…')
  editor = await MappingEditor.mount({
    root: document.getElementById('editor-root'),
    adapter,
    onStatus,
  })
  hideOverlay()
  document.getElementById('save-btn').disabled = false
  document.getElementById('save-restart-btn').disabled = false
}

document.getElementById('refresh-btn').addEventListener('click', () => { if (editor) editor.refreshComponents() })
document.getElementById('save-btn').addEventListener('click', () => { if (editor) editor.save() })
document.getElementById('save-restart-btn').addEventListener('click', () => { if (editor) editor.saveAndApply() })

// ── Network panel ─────────────────────────────────────────────────────────────

async function initNetwork() {
  const localCode = document.getElementById('net-local-url')
  const lanCode    = document.getElementById('net-lan-url')
  const lanCopyBtn = document.getElementById('net-lan-copy')
  const toggle     = document.getElementById('uci-enabled-toggle')
  const hostInput  = document.getElementById('host-input')

  // Load current host
  try {
    const host = await ipcRenderer.invoke('cfg:get-host')
    hostInput.value = host ?? ''
  } catch { /* leave blank */ }

  try {
    const info = await ipcRenderer.invoke('cfg:get-network-info')
    localCode.textContent = info.localUrl
    if (info.lanUrl) {
      lanCode.textContent = info.lanUrl
      lanCopyBtn.disabled = false
    } else {
      lanCode.textContent = 'No network detected — connect to Wi-Fi'
      lanCopyBtn.disabled = true
    }
    toggle.checked = info.uciEnabled
    document.getElementById('uci-port-input').value = info.uciPort
  } catch (e) {
    localCode.textContent = 'Error: ' + e.message
    lanCode.textContent = 'Error: ' + e.message
    lanCopyBtn.disabled = true
  }

  try {
    const hasPassword = await ipcRenderer.invoke('cfg:has-mappings-password')
    document.getElementById('mappings-password-input').placeholder =
      hasPassword ? 'Password set — enter a new one to change it' : 'Set a password to enable /mappings'
  } catch { /* leave default placeholder */ }
}

document.getElementById('host-save-btn').addEventListener('click', async () => {
  const hostInput  = document.getElementById('host-input')
  const hostStatus = document.getElementById('host-status')
  const host = hostInput.value.trim()
  hostStatus.textContent = 'Saving…'
  hostStatus.style.color = 'var(--text-dim)'
  try {
    const { needsRestart } = await ipcRenderer.invoke('cfg:save-host', host)
    if (!host) {
      hostStatus.textContent = '✓ Cleared'
    } else if (needsRestart) {
      hostStatus.textContent = '✓ Saved — restart the app to connect'
    } else {
      hostStatus.textContent = '✓ Saved — connecting…'
    }
    hostStatus.style.color = 'var(--green)'
  } catch (e) {
    hostStatus.textContent = '✗ ' + e.message
    hostStatus.style.color = 'var(--red)'
  }
})

// Main process pushes this when the configurator's QRC connects after a host change
ipcRenderer.on('cfg:host-connected', async () => {
  // refreshComponents re-runs discover(), whose getQsysStatus call also
  // redraws the header pill.
  if (editor) await editor.refreshComponents()
  const hostStatus = document.getElementById('host-status')
  hostStatus.textContent = '✓ Connected'
  setTimeout(() => { hostStatus.textContent = '' }, 3000)
})

document.getElementById('net-local-copy').addEventListener('click', () => {
  clipboard.writeText(document.getElementById('net-local-url').textContent)
})

document.getElementById('net-lan-copy').addEventListener('click', () => {
  clipboard.writeText(document.getElementById('net-lan-url').textContent)
})

document.getElementById('uci-enabled-toggle').addEventListener('change', async e => {
  const hint = document.getElementById('net-hint')
  try {
    await ipcRenderer.invoke('cfg:set-uci-enabled', e.target.checked)
    hint.textContent = 'Restart required to apply changes to the UCI server'
  } catch (err) {
    hint.textContent = 'Error: ' + err.message
    e.target.checked = !e.target.checked
  }
})

document.getElementById('uci-port-save-btn').addEventListener('click', async () => {
  const hint = document.getElementById('net-hint')
  const portInput = document.getElementById('uci-port-input')
  const restartBtn = document.getElementById('uci-restart-btn')
  const port = parseInt(portInput.value, 10)
  try {
    await ipcRenderer.invoke('cfg:set-uci-port', port)
    hint.textContent = 'Port saved — restart required to apply'
    hint.style.color = 'var(--text-dim)'
    restartBtn.classList.remove('hidden')
  } catch (err) {
    hint.textContent = 'Error: ' + err.message
    hint.style.color = 'var(--red)'
  }
})

document.getElementById('uci-restart-btn').addEventListener('click', () => {
  ipcRenderer.invoke('cfg:restart-app')
})

document.getElementById('mappings-password-save-btn').addEventListener('click', async () => {
  const input = document.getElementById('mappings-password-input')
  const status = document.getElementById('mappings-password-status')
  try {
    await ipcRenderer.invoke('cfg:set-mappings-password', input.value)
    status.textContent = '✓ Saved'
    status.style.color = 'var(--green)'
    input.value = ''
    input.placeholder = 'Password set — enter a new one to change it'
  } catch (err) {
    status.textContent = '✗ ' + err.message
    status.style.color = 'var(--red)'
  }
})

// ── Helpers ───────────────────────────────────────────────────────────────────

function setOverlay(msg) {
  document.getElementById('overlay').style.display = 'flex'
  document.getElementById('overlay-msg').textContent = msg
}

function hideOverlay() {
  document.getElementById('overlay').style.display = 'none'
}

// ── Go ────────────────────────────────────────────────────────────────────────

init().catch(e => {
  hideOverlay()
  document.getElementById('save-status').className = 'err'
  document.getElementById('save-status').textContent = 'Init error: ' + e.message
  console.error(e)
})

initNetwork().catch(e => console.error('Network panel init error:', e))
</script>
</body>
</html>
