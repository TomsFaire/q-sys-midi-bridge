version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: ["dependencies"]
    commit-message:
      prefix: "chore"
      include: scope
    groups:
      # electron + builder + updater move together; a major Electron bump
      # generally needs a matching builder.
      electron-toolchain:
        patterns: ["electron", "electron-builder", "electron-updater"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    labels: ["dependencies", "ci"]
